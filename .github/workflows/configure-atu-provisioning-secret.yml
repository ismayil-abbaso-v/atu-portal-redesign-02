name: Configure ATU provisioning secret

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      ATU_PROJECT_REF: tdxrpbrcgricqqfdytyg
      ATU_OFFICIAL_PROVISION_SECRET: ${{ secrets.ATU_OFFICIAL_PROVISION_SECRET }}
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Missing SUPABASE_ACCESS_TOKEN'; exit 1; }
          test -n "$ATU_OFFICIAL_PROVISION_SECRET" || { echo 'Missing ATU_OFFICIAL_PROVISION_SECRET'; exit 1; }

      - name: Set ATU worker secret
        run: supabase secrets set --project-ref "$ATU_PROJECT_REF" ATU_OFFICIAL_PROVISION_SECRET="$ATU_OFFICIAL_PROVISION_SECRET"

      - name: Confirm worker functions exist
        shell: bash
        run: |
          set -euo pipefail
          supabase functions list --project-ref "$ATU_PROJECT_REF" | tee /tmp/functions.txt
          grep -q 'process-official-exam-outbox' /tmp/functions.txt || {
            echo 'process-official-exam-outbox is not deployed'
            exit 1
          }
