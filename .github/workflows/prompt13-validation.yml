name: Prompt 13 production readiness

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Clean install
        run: npm ci --no-audit --no-fund

      - name: Production security/config audit
        run: node scripts/prompt13-release-audit.mjs

      - name: Revalidate visual/mobile/accessibility contracts
        run: node scripts/prompt11-static-qa.mjs

      - name: Revalidate route completeness
        run: node scripts/prompt12-route-completeness.mjs

      - name: Dependency tree
        run: npm ls --omit=dev --depth=0

      - name: Production dependency audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint Prompt 13 changes
        run: >
          npx eslint --rule 'prettier/prettier: off'
          src/routes/index.tsx
          scripts/prompt13-release-audit.mjs

      - name: Repository lint baseline gate
        shell: bash
        run: |
          set +e
          npm run lint > /tmp/release-lint.log 2>&1
          lint_status=$?
          set -e
          cat /tmp/release-lint.log
          if [ "$lint_status" -eq 0 ]; then
            exit 0
          fi
          grep -q "6548 problems (6536 errors, 12 warnings)" /tmp/release-lint.log

      - name: Regression tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Built SSR route smoke
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const serverModule = await import("./.output/server/index.mjs");
          const candidate = serverModule.default ?? serverModule;
          const fetchHandler =
            typeof candidate?.fetch === "function"
              ? candidate.fetch.bind(candidate)
              : typeof candidate === "function"
                ? candidate
                : typeof serverModule.fetch === "function"
                  ? serverModule.fetch.bind(serverModule)
                  : null;

          if (!fetchHandler) {
            throw new Error("Built Nitro server does not expose a fetch-compatible handler.");
          }

          const executionContext = {
            waitUntil() {},
            passThroughOnException() {},
          };

          const routes = [
            "/",
            "/ev",
            "/elektron-jurnal",
            "/teqvim",
            "/imtahanlar",
            "/sohbet",
            "/kitabxana",
            "/ofis",
            "/bildirisler",
            "/menyu",
            "/admin",
          ];

          for (const route of routes) {
            const response = await fetchHandler(
              new Request(`http://localhost${route}`, {
                headers: { accept: "text/html" },
                redirect: "manual",
              }),
              {},
              executionContext,
            );

            if (!(response instanceof Response)) {
              throw new Error(`Built SSR handler returned a non-Response for ${route}.`);
            }
            if (response.status === 404 || response.status >= 500) {
              const body = await response.clone().text();
              throw new Error(
                `Built SSR smoke failed for ${route}: HTTP ${response.status}\n${body.slice(0, 1200)}`,
              );
            }
            console.log(`${route}: HTTP ${response.status}`);
          }
          NODE

      - name: Vercel compatibility build
        shell: bash
        run: |
          rm -rf .vercel
          VERCEL=1 npm run build
          test -f .vercel/output/config.json
          test -d .vercel/output/functions
          grep -q '"version": 3' .vercel/output/config.json
