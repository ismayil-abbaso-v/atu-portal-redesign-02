name: Prompt 3 validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run Prompt 3 regression tests
        run: bun test src/lib/official-result-sync.test.ts src/lib/official-exam-integration.test.ts

      - name: Run full regression suite
        run: bun run test

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
