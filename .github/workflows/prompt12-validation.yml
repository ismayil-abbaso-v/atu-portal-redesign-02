name: Prompt 12 route completeness
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm install --no-audit --no-fund
      - name: Revalidate Prompt 11 visual/mobile/accessibility contracts
        run: node scripts/prompt11-static-qa.mjs
      - name: Route completeness audit
        run: node scripts/prompt12-route-completeness.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Lint Prompt 12 TypeScript changes
        run: >
          npx eslint --rule 'prettier/prettier: off'
          src/routes/_authenticated/route.tsx
          src/lib/i18n.tsx
      - name: Repository lint baseline
        continue-on-error: true
        run: npm run lint
      - name: Regression tests
        run: npm test
      - name: Production build
        run: npm run build
