name: Prompt 17 final conformance

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Clean install
        run: npm ci --no-audit --no-fund

      - name: Prompt 11 visual/accessibility static contracts
        run: node scripts/prompt11-static-qa.mjs

      - name: Prompt 12 route completeness
        run: node scripts/prompt12-route-completeness.mjs

      - name: Prompt 13 release audit
        run: node scripts/prompt13-release-audit.mjs

      - name: Prompt 16 responsive/accessibility guard
        run: npm run qa:responsive-a11y

      - name: Prompt 17 conformance audit
        run: npm run qa:prompt17

      - name: Typecheck
        run: npm run typecheck

      - name: Lint Prompt 17 script
        run: npx eslint --rule 'prettier/prettier: off' scripts/prompt17-conformance-audit.mjs

      - name: Repository lint inherited-debt gate
        shell: bash
        run: |
          set +e
          npm run lint > /tmp/prompt17-lint.log 2>&1
          lint_status=$?
          set -e
          cat /tmp/prompt17-lint.log
          if [ "$lint_status" -eq 0 ]; then
            exit 0
          fi
          grep -q "6532 problems (6520 errors, 12 warnings)" /tmp/prompt17-lint.log

      - name: Regression tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Built SSR route smoke
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const serverModule = await import("./.output/server/index.mjs");
          const candidate = serverModule.default ?? serverModule;
          const fetchHandler =
            typeof candidate?.fetch === "function"
              ? candidate.fetch.bind(candidate)
              : typeof candidate === "function"
                ? candidate
                : typeof serverModule.fetch === "function"
                  ? serverModule.fetch.bind(serverModule)
                  : null;

          if (!fetchHandler) {
            throw new Error("Built Nitro server does not expose a fetch-compatible handler.");
          }

          const executionContext = {
            waitUntil() {},
            passThroughOnException() {},
          };

          const routes = [
            "/",
            "/ev",
            "/elektron-jurnal",
            "/teqvim",
            "/imtahanlar",
            "/sohbet",
            "/kitabxana",
            "/ofis",
            "/bildirisler",
            "/menyu",
            "/menyu/transkript",
            "/menyu/profil",
            "/menyu/tehlukesizlik",
            "/menyu/bildiris",
            "/menyu/gorunus",
            "/menyu/yardim",
            "/admin",
          ];

          for (const route of routes) {
            const response = await fetchHandler(
              new Request(`http://localhost${route}`, {
                headers: { accept: "text/html" },
                redirect: "manual",
              }),
              {},
              executionContext,
            );

            if (!(response instanceof Response)) {
              throw new Error(`Built SSR handler returned a non-Response for ${route}.`);
            }
            if (response.status === 404 || response.status >= 500) {
              const body = await response.clone().text();
              throw new Error(
                `Built SSR smoke failed for ${route}: HTTP ${response.status}\n${body.slice(0, 1200)}`,
              );
            }
            console.log(`${route}: HTTP ${response.status}`);
          }
          NODE

      - name: Vercel compatibility build
        shell: bash
        run: |
          rm -rf .vercel
          VERCEL=1 npm run build
          test -f .vercel/output/config.json
          test -d .vercel/output/functions
          grep -q '"version": 3' .vercel/output/config.json
